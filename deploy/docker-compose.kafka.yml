# Pedidos360: arquitectura Kafka (streaming y analítica). Convive con RabbitMQ, no lo reemplaza.
#   3 nodos Zookeeper (quórum)  +  3 brokers Kafka  +  Kafka-UI
#
# Uso junto al stack principal (misma red, mismo proyecto):
#       docker compose -f docker-compose.yml -f docker-compose.kafka.yml up -d --build
# Solo Kafka (por ejemplo en una segunda EC2):
#       docker compose -f docker-compose.kafka.yml up -d
#
# Los tópicos NO se crean solos (auto.create.topics.enable=false): se administran
# desde el microservicio ms-kafka-admin o desde Kafka-UI (http://<host>:8090).

name: pedidos360

# ---------- Configuración común de los nodos Zookeeper ----------
# Zookeeper guarda los metadatos del clúster (brokers vivos, controlador, configuración
# de tópicos). Con 3 nodos hay quórum: el clúster sigue operando si cae 1 nodo.
x-zookeeper: &zookeeper
  image: confluentinc/cp-zookeeper:7.6.1
  restart: unless-stopped
  mem_limit: 256m
  networks: [pedidos360]
  healthcheck:
    test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/2181'"]
    interval: 10s
    timeout: 5s
    retries: 12

x-zookeeper-env: &zookeeper-env
  ZOOKEEPER_CLIENT_PORT: 2181
  ZOOKEEPER_TICK_TIME: 2000
  ZOOKEEPER_INIT_LIMIT: 5
  ZOOKEEPER_SYNC_LIMIT: 2
  # Miembros del quórum: host:puertoSeguidores:puertoElección
  ZOOKEEPER_SERVERS: zookeeper1:2888:3888;zookeeper2:2888:3888;zookeeper3:2888:3888
  KAFKA_HEAP_OPTS: -Xms96m -Xmx128m

# ---------- Configuración común de los brokers Kafka ----------
x-kafka: &kafka
  image: confluentinc/cp-kafka:7.6.1
  restart: unless-stopped
  mem_limit: ${KAFKA_MEM_LIMIT:-640m}
  networks: [pedidos360]
  depends_on:
    zookeeper1:
      condition: service_healthy
    zookeeper2:
      condition: service_healthy
    zookeeper3:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/29092'"]
    interval: 10s
    timeout: 5s
    retries: 18

x-kafka-env: &kafka-env
  KAFKA_ZOOKEEPER_CONNECT: zookeeper1:2181,zookeeper2:2181,zookeeper3:2181
  # INTERNAL: tráfico entre contenedores (microservicios y brokers). EXTERNAL: clientes fuera de Docker.
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  # Valores por defecto alineados con la pauta: 3 particiones y 3 réplicas
  KAFKA_NUM_PARTITIONS: 3
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  # Con acks=all un mensaje se confirma cuando lo tienen al menos 2 réplicas:
  # se tolera la caída de 1 broker sin perder datos ni dejar de escribir.
  KAFKA_MIN_INSYNC_REPLICAS: 2
  # Tópicos internos (offsets de los consumer groups y transacciones) también replicados
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  # Los tópicos se crean de forma controlada (ms-kafka-admin), no por accidente al publicar
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_DELETE_TOPIC_ENABLE: "true"
  # Retención por defecto del broker (cada tópico la puede sobreescribir)
  KAFKA_LOG_RETENTION_HOURS: 168
  KAFKA_HEAP_OPTS: -Xms256m -Xmx384m

services:

  # ---------- Zookeeper (quórum de 3) ----------

  zookeeper1:
    <<: *zookeeper
    hostname: zookeeper1
    environment:
      <<: *zookeeper-env
      ZOOKEEPER_SERVER_ID: 1
    volumes:
      - zookeeper1_data:/var/lib/zookeeper/data
      - zookeeper1_log:/var/lib/zookeeper/log

  zookeeper2:
    <<: *zookeeper
    hostname: zookeeper2
    environment:
      <<: *zookeeper-env
      ZOOKEEPER_SERVER_ID: 2
    volumes:
      - zookeeper2_data:/var/lib/zookeeper/data
      - zookeeper2_log:/var/lib/zookeeper/log

  zookeeper3:
    <<: *zookeeper
    hostname: zookeeper3
    environment:
      <<: *zookeeper-env
      ZOOKEEPER_SERVER_ID: 3
    volumes:
      - zookeeper3_data:/var/lib/zookeeper/data
      - zookeeper3_log:/var/lib/zookeeper/log

  # ---------- Brokers Kafka (clúster de 3) ----------
  # Dentro de la red Docker los microservicios usan kafka1:29092,kafka2:29092,kafka3:29092

  kafka1:
    <<: *kafka
    hostname: kafka1
    ports:
      - "9092:9092"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9092
    volumes:
      - kafka1_data:/var/lib/kafka/data

  kafka2:
    <<: *kafka
    hostname: kafka2
    ports:
      - "9093:9093"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 2
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9093
    volumes:
      - kafka2_data:/var/lib/kafka/data

  kafka3:
    <<: *kafka
    hostname: kafka3
    ports:
      - "9094:9094"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 3
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9094
    volumes:
      - kafka3_data:/var/lib/kafka/data

  # ---------- Kafka-UI: administración de brokers, tópicos, particiones, mensajes y consumer groups ----------

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    restart: unless-stopped
    mem_limit: 384m
    networks: [pedidos360]
    ports:
      - "8090:8080"                   # el 8080 del host lo usa el microservicio auth
    environment:
      KAFKA_CLUSTERS_0_NAME: pedidos360
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:29092,kafka2:29092,kafka3:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper1:2181,zookeeper2:2181,zookeeper3:2181
      # El panel permite borrar tópicos y leer mensajes: se protege con usuario y clave
      AUTH_TYPE: LOGIN_FORM
      SPRING_SECURITY_USER_NAME: ${KAFKA_UI_USER:-admin}
      SPRING_SECURITY_USER_PASSWORD: ${KAFKA_UI_PASS:?Definir KAFKA_UI_PASS en el archivo .env}
      JAVA_OPTS: -Xms128m -Xmx256m
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy

networks:
  pedidos360:

volumes:
  zookeeper1_data:
  zookeeper1_log:
  zookeeper2_data:
  zookeeper2_log:
  zookeeper3_data:
  zookeeper3_log:
  kafka1_data:
  kafka2_data:
  kafka3_data:
